name: atlas-data

# Служебный воркфлоу: снимает свежий снимок игровых данных Deadlock через Deadlock API
# и коммитит результат в ветку, из которой запущен (каталог data/raw).
#
# Запускается при изменениях в tools/ и вручную из вкладки Actions (Run workflow).

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/atlas-data.yml'
  workflow_dispatch:
    inputs:
      builds_per_hero:
        description: 'Сколько сборок брать на героя'
        required: false
        default: '6'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Скачать снимок данных
        run: |
          python3 tools/fetch_raw.py \
            --out data/raw \
            --builds-per-hero "${{ github.event.inputs.builds_per_hero || '6' }}"

      - name: Итоговые счётчики
        run: |
          cat data/raw/meta.json
          du -sh data/raw

      - name: Закоммитить снимок
        run: |
          git config user.name "Deadlock Atlas"
          git config user.email "maxim.mishunov2017@yandex.ru"
          git add -A data
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "Снимок игровых данных Deadlock API"
          git push
