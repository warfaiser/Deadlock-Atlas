name: atlas-data

# Служебный воркфлоу: снимает свежий снимок игровых данных Deadlock через Deadlock API
# и складывает результат в артефакт `deadlock-raw` (data/raw).
#
# Запускается при изменениях в tools/ и вручную из вкладки Actions (Run workflow).

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/atlas-data.yml'
  workflow_dispatch:
    inputs:
      builds_per_hero:
        description: 'Сколько сборок брать на героя'
        required: false
        default: '6'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Скачать снимок данных
        run: |
          python3 tools/fetch_raw.py \
            --out data/raw \
            --builds-per-hero "${{ github.event.inputs.builds_per_hero || '6' }}"

      - name: Итоговые счётчики
        run: |
          cat data/raw/meta.json
          du -sh data/raw
          ls -la data/raw

      - uses: actions/upload-artifact@v4
        with:
          name: deadlock-raw
          path: data/raw
          retention-days: 7
          if-no-files-found: error
